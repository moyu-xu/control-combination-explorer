[project]
name = "control-combination-explorer"
version = "2026.10.6"
description = "Offline control-variable combination search for Stata datasets"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "pyreadstat>=1.2.8,<2",
  "pyfixest>=0.40,<1",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "pyinstaller>=6.11,<7",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

